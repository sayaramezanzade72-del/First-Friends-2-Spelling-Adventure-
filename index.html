<html lang="en" translate="no">
<head>
<meta charset="UTF-8">

<meta name="google" content="notranslate">
<title>First Friends 2 - Spelling Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:linear-gradient(135deg,#b8f4e7,#e7d5ff,#fff0b7);font-family:Arial,sans-serif;text-align:center;color:#30345b}
.screen{display:none;max-width:680px;margin:10px auto;padding:20px 14px;background:white;border-radius:25px;border:4px solid white;box-shadow:0 8px 25px #55408030}
.active{display:block}
h1{font-size:clamp(27px,6vw,38px);color:#7951d6}
h2{color:#f57960}
button{border:0;border-radius:13px;padding:12px 16px;margin:5px;background:#7951d6;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
input{width:95%;max-width:380px;padding:14px;border:3px solid #d7c9ff;border-radius:14px;font-size:19px;text-align:center;margin:10px}
.stats{display:flex;justify-content:space-around;gap:7px;flex-wrap:wrap}
.stat{background:#f0eaff;padding:10px;border-radius:12px;font-weight:bold}
#bar{height:12px;background:#eee8fa;border-radius:20px;margin:15px 0;overflow:hidden}
#fill{height:100%;width:0;background:#17b99a;transition:width .25s}
#picture{width:min(100%,340px);height:235px;margin:8px auto;display:block}
#feedback{font-weight:bold;font-size:19px;min-height:30px;margin:12px}
.green{background:#16a995}
.orange{background:#ff865d}
.small{font-size:13px;color:#777}
#choices{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.choice{background:#f0eaff;color:#493b79;min-width:100px;border:2px solid #d9cbff}
.matchRow{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0;padding:8px;border-bottom:1px solid #eee}
.matchPic{width:100px;height:85px;background:#effaff;border-radius:12px}
footer{margin-top:18px;font-size:13px;font-weight:bold}
</style>
</head>
<body>

<section id="start" class="screen active">
<h1>First Friends 2</h1>
<h2>Spelling Adventure</h2>
<div id="cover"></div>
<p><b>Listen • Spell • Complete • Match</b></p>
<p>Enter Your Name</p>
<input id="player" placeholder="Your Name" maxlength="24">
<br><button onclick="startGame()">START GAME</button>
<p class="small">4 Stages • 5 Lives • 47 Words</p>
<footer>Teacher: Ms.Ramezanzadeh</footer>
</section>

<section id="game" class="screen">
<h1>Spelling Adventure</h1>
<div class="stats">
<div class="stat">👤 <span id="name"></span></div>
<div class="stat">❤️ <span id="lives"></span></div>
<div class="stat">⭐ <span id="score">0</span></div>
</div>
<h2 id="stageTitle"></h2>
<p id="stageInfo"></p>
<div id="bar"><div id="fill"></div></div>
<p id="counter"></p>
<div id="visual"></div>
<div id="controls"></div>
<div id="feedback" aria-live="polite"></div>
<footer>Teacher: Ms.Ramezanzadeh</footer>
</section>

<section id="over" class="screen">
<h1 style="color:#e44d63">GAME OVER!</h1>
<div id="overPicture"></div>
<h2 id="overName"></h2>
<p id="overScore"></p>
<button onclick="replay()">PLAY AGAIN</button>
</section>

<section id="win" class="screen">
<h1 style="color:#12a783">YOU WIN!</h1>
<div id="winPicture"></div>
<h2 id="winner"></h2>
<p id="result"></p>
<button onclick="replay()">PLAY AGAIN</button>
<footer>Teacher: Ms.Ramezanzadeh</footer>
</section>

function startGame(){
 player=$("player").value.trim();
 if(!player){$("player").placeholder="Please Enter Your Name!";$("player").focus();return}
 lives=5;score=0;stage=0;index=0;locked=false;
 show("game");newStage();
}
function newStage(){
 if(lives<=0)return endGame();
 if(stage>=4)return winGame();
 deck=shuffle([...words]);index=0;locked=false;selected=null;
 $("stageTitle").textContent=stageNames[stage];
 $("name").textContent=player;
 $("feedback").textContent="";
 showQuestion();
}
function updateStats(){
 $("lives").textContent="❤️".repeat(lives)+"🤍".repeat(5-lives);
 $("score").textContent=score;
 $("counter").textContent=`Question ${index+1} of ${deck.length}`;
 $("fill").style.width=(index/deck.length*100)+"%";
 $("stageInfo").textContent=`Stage ${stage+1} of 4`;
}
function showQuestion(){
 if(lives<=0)return endGame();
 if(index>=deck.length){stage++;return newStage()}
 locked=false;
 updateStats();
 const [word,type]=deck[index];
 $("visual").innerHTML="";
 $("controls").innerHTML="";
 $("feedback").textContent="";
 if(stage===0){
  $("visual").innerHTML='<p>Listen carefully!</p><button class="green" id="listen">🔊 LISTEN</button>';
  $("listen").onclick=speak;
  $("controls").innerHTML='<input id="answer" placeholder="Type the word" autocomplete="off" autocapitalize="none" spellcheck="false"><br><button id="check">CHECK ANSWER</button>';
  $("check").onclick=check;
  $("answer").onkeydown=e=>{if(e.key==="Enter")check()};
  setTimeout(speak,350);
 }
 if(stage===1){
  let chars=word.split("");
  let positions=chars.map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);
  let blanks=shuffle([...positions]).slice(0,Math.min(2,positions.length));
  if(blanks.length===0)blanks=[0];
  let answerChars=[...chars];
  blanks.forEach(i=>answerChars[i]="_");
  $("visual").innerHTML=`<h2>${word.length} letters</h2><div style="font-size:32px;letter-spacing:5px;color:#7853d4">${answerChars.join("")}</div>`;
  $("controls").innerHTML=`<input id="answer" placeholder="Complete the word" autocomplete="off" autocapitalize="none" spellcheck="false"><br><button id="check">CHECK ANSWER</button>`;
  $("check").onclick=()=>checkPattern(word,blanks,answerChars);
  $("answer").onkeydown=e=>{if(e.key==="Enter")checkPattern(word,blanks,answerChars)};
  $("answer").dataset.word=word;
  $("answer").dataset.blanks=blanks.join(",");
  $("answer").dataset.pattern=answerChars.join("");
  $("answer").placeholder="Write the complete word";
 }
 if(stage===2){
  $("visual").innerHTML=cartoon(type);
  $("controls").innerHTML=`<input id="answer" placeholder="What is it?" autocomplete="off" autocapitalize="none" spellcheck="false"><br><button id="check">CHECK ANSWER</button>`;
  $("check").onclick=check;
  $("answer").onkeydown=e=>{if(e.key==="Enter")check()};
 }
 if(stage===3){
  const options=shuffle([deck[index],...shuffle(words.filter(w=>w[0]!==word)).slice(0,3)]);
  $("visual").innerHTML=cartoon(type);
  $("controls").innerHTML='<p>Choose the correct word for the picture.</p><div id="choices"></div>';
  options.forEach(opt=>{
   const b=document.createElement("button");
   b.className="choice";b.textContent=opt[0];
   b.onclick=()=>matchCheck(opt[0],word,b);
   $("choices").appendChild(b);
  });
 }
}
function speak(){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(deck[index][0]);
 u.lang="en-GB";u.rate=.82;
 speechSynthesis.speak(u);
}
function beep(ok){
 try{
  let c=new(window.AudioContext||window.webkitAudioContext)();
  let o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;
  g.gain.value=.12;o.start();o.stop(c.currentTime+.2);
  o.onended=()=>c.close();
 }catch(e){}
}
function correct(){
 locked=true;score+=10;beep(true);
 $("feedback").textContent="Excellent! Correct!";
 $("feedback").style.color="#119b77";
 $("controls").querySelectorAll("button,input").forEach(x=>x.disabled=true);
 $("fill").style.width=((index+1)/deck.length*100)+"%";
 setTimeout(()=>{index++;showQuestion()},650);
}
function wrong(){
 lives--;beep(false);
 $("lives").textContent="❤️".repeat(lives)+"🤍".repeat(5-lives);
 $("feedback").textContent=lives===0?"GAME OVER!":"Try Again!";
 $("feedback").style.color="#e44e4e";
 if(lives<=0){locked=true;setTimeout(endGame,400)}
}
function check(){
 if(locked||lives<=0)return;
 let val=$("answer").value.trim().toLowerCase();
 if(!val){$("feedback").textContent="Please Type Your Answer!";return}
 if(val===deck[index][0].toLowerCase())correct();
 else wrong();
}
function checkPattern(word,blanks,pattern){
 if(locked||lives<=0)return;
 const val=$("answer").value.trim().toLowerCase();
 if(!val){$("feedback").textContent="Please Complete the Word!";return}
 if(val===word.toLowerCase())correct();
 else wrong();
}
function matchCheck(choice,word,button){
 if(locked||lives<=0)return;
 if(choice.toLowerCase()===word.toLowerCase()){
  $("controls").querySelectorAll("button").forEach(b=>b.disabled=true);
  correct();
 }else{
  wrong();
  button.disabled=true;
 }
}
function endGame(){
 if("speechSynthesis"in window)speechSynthesis.cancel();
 $("overName").textContent=player;
 $("overScore").textContent=`Your Score: ${score}`;
 $("overPicture").innerHTML=cartoon("sad");
 show("over");
}
function winGame(){
 if("speechSynthesis"in window)speechSynthesis.cancel();
 $("winner").textContent=`Well Done, ${player}!`;
 $("result").textContent=`Your Score: ${score} • Lives Remaining: ${lives}`;
 $("winPicture").innerHTML=cartoon("happy");
 show("win");
}
function replay(){
 if("speechSynthesis"in window)speechSynthesis.cancel();
 $("player").value=player;show("start");
}
$("player").addEventListener("keydown",e=>{if(e.key==="Enter")startGame()});
$("cover").innerHTML=cartoon("school");
</script>
</body>
</html>
